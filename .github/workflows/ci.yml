name: CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

# F8 (P5.7) - every `uses:` is pinned to a full commit SHA with the release it
# corresponds to in a trailing comment. A tag like `@v4` is a mutable pointer
# owned by the action's publisher: whoever controls that repository (or steals
# a maintainer token, which is how the tj-actions/changed-files and
# reviewdog compromises worked) can retarget it and immediately execute code
# in every job on every branch of every repo that follows it. Several of these
# jobs run with the repository checkout on disk, and the `release` job holds
# `contents: write`, so that is a real path from a third-party account to this
# project's release assets. A SHA cannot be retargeted.
#
# Updating a pin: read the trailing comment for the version in use, pick the
# new release, and resolve it once -
#   gh api repos/actions/checkout/git/ref/tags/v4.5.0 --jq '.object.sha'
# then replace both the SHA and the comment. Dependabot/Renovate understand
# this exact `<sha> # <version>` form and will raise the bump automatically if
# either is ever enabled here.

# F8 (partial) — cancel superseded runs on the same ref; never cancel runs on
# main so its history keeps complete evidence. The ${{ }} here is a workflow
# expression, not run-block interpolation: no injection surface is introduced.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # ------------------------------------------------------------------
  # P0.2 — Linux gate. This is the required baseline: it must stay green
  # and has NO failure allowance.
  # ------------------------------------------------------------------
  linux-test:
    name: Linux amd64 — vet, test, check-make, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: go mod tidy -diff
        run: go mod tidy -diff
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      - name: check-make
        run: scripts/check-make.sh
      - name: make build
        run: make build

  # ------------------------------------------------------------------
  # P0.2 — Windows cross-compile from Linux (amd64 + arm64).
  # P2.6: the shared code no longer imports Unix APIs and both commands
  # compile against the Windows platform stubs, so this job is REQUIRED
  # and its failure allowance is gone. It proves source portability only;
  # the stubs still return "not implemented" until Phase 3.
  # ------------------------------------------------------------------
  cross-build-windows:
    name: Cross-build windows/${{ matrix.goarch }} (from Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    env:
      GOOS: windows
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: 0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Cross-compile both commands
        run: go build ./cmd/...
      # P2.7 review finding F6: `go build ./cmd/...` never compiles test
      # files, so a Windows-broken _test.go stayed invisible to this gate.
      # Vet the whole module, tests included.
      - name: Vet everything for Windows (includes test files)
        run: go vet ./...

  # ------------------------------------------------------------------
  # P0.3 / review F1 — Native Windows amd64 FULL-SUITE job on a pinned
  # runner image (windows-2025, not the floating windows-latest label).
  #
  # This is the spec's symlink-CAPABLE job ("Build and release": at least
  # one Windows CI job must run the full suite in a symlink-capable test
  # environment). Capability here is MANDATORY, not advisory:
  #
  #   1. The probe hard-fails (exit 1) when the runner cannot create a
  #      directory symlink. GitHub-hosted Windows runners are capable, so
  #      absence means the harness is broken — not that the security
  #      tests are optional. Degraded-mode behaviour is exercised by the
  #      separate windows-degraded-test job, never by this one.
  #   2. After the suite runs, the job fails if any
  #      SKIP(symlink-capability) line appears in the -v output, so a
  #      capability regression (runner image change, stray
  #      SCRATCHPAD_TEST_SYMLINKS=0 in the environment) turns the job
  #      red instead of silently erasing the containment suite.
  #   3. The assertion cannot pass vacuously: the job also fails when the
  #      output contains no `--- PASS/FAIL/SKIP:` result lines at all
  #      (e.g. every package failed to build), so "zero skips" can never
  #      be satisfied by a suite that never ran.
  #
  # The allowance this job used to carry is GONE. P3.11 and Phase 4 landed
  # the Windows store backend, and run 32970247103 recorded this job green
  # with zero capability skips, which was the stated exit condition. A red
  # here is now a real regression and fails the workflow.
  #
  # Failing the workflow is not the same as blocking a merge: that also
  # needs a branch protection rule on main naming this check, which is an
  # operator action nobody in this chain can take — see EXECUTION.md.
  # ------------------------------------------------------------------
  windows-symlink-required:
    name: Windows amd64 native — full suite, symlink-capable (windows-2025)
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      CGO_ENABLED: 0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Probe symlink capability (mandatory in this job)
        id: probe
        shell: pwsh
        run: |
          $probe = Join-Path ([System.IO.Path]::GetTempPath()) ("scratchpad-symlink-probe-" + [System.Guid]::NewGuid().ToString("N"))
          New-Item -ItemType Directory -Path $probe | Out-Null
          $target = Join-Path $probe "target"
          New-Item -ItemType Directory -Path $target | Out-Null
          $link = Join-Path $probe "link"
          try {
            New-Item -ItemType SymbolicLink -Path $link -Target $target -ErrorAction Stop | Out-Null
            Write-Host "symlink capability: PRESENT (directory symlink created at $link)"
          } catch {
            Write-Host "::error::symlink capability ABSENT on this runner ($($_.Exception.Message)). GitHub-hosted Windows runners are symlink-capable, so absence means the harness or image is broken. This job REQUIRES the capability and never runs the suite in degraded mode (that is windows-degraded-test's job)."
            exit 1
          } finally {
            Remove-Item -Recurse -Force $probe -ErrorAction SilentlyContinue
          }
          Add-Content -Path $env:GITHUB_ENV -Value "SCRATCHPAD_TEST_SYMLINKS=1"
          Write-Host "SCRATCHPAD_TEST_SYMLINKS=1"
      - name: go vet
        shell: pwsh
        run: go vet ./...
      # review F2: `if: always()` (guarded on the probe) so the test step
      # executes and its output is observable even while vet fails on the
      # missing Windows backend. It never runs after a failed probe: this
      # job must not produce full-suite output from an incapable runner.
      - name: go test (full suite, -v, symlink capability required)
        if: ${{ always() && steps.probe.outcome == 'success' }}
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "go-test-output.txt"
          go test ./... -v 2>&1 | Tee-Object -FilePath $out
          $testExit = $LASTEXITCODE
          Write-Host "go test exit code: $testExit"
          $failed = $false
          # Non-vacuous guard: a run that produced no test result lines
          # (e.g. every package failed to build) must not let the skip
          # assertion below succeed by having nothing to scan.
          $results = @(Select-String -Path $out -Pattern '^--- (PASS|FAIL|SKIP): ')
          if ($results.Count -eq 0) {
            Write-Host "::error::no '--- PASS/FAIL/SKIP:' result lines in the go test output - the suite did not actually run, so the symlink-capability assertion would be vacuous."
            $failed = $true
          } else {
            Write-Host "test result lines: $($results.Count)"
          }
          # The capability assertion: in this job NOTHING may skip for
          # lack of symlink capability. This is what makes it the spec's
          # symlink-capable job rather than an advisory warning.
          $capSkips = @(Select-String -Path $out -SimpleMatch 'SKIP(symlink-capability)')
          if ($capSkips.Count -gt 0) {
            Write-Host "::error::$($capSkips.Count) test(s) skipped for missing symlink capability in the symlink-REQUIRED job:"
            $capSkips | ForEach-Object { Write-Host $_.Line }
            $failed = $true
          } else {
            Write-Host "symlink-capability skips: 0 (as required)"
          }
          # The same assertion for 8.3 short-name capability (P6.2/P6.3 F1).
          # TestShortNameAliasDoesNotBypassVisibility is the only executable
          # proof that a requester-supplied URL segment cannot address an
          # ignore-hidden or reserved directory through its 8.3 alias, and it
          # self-skips when the volume generates no aliases. Hosted runners
          # generate them today (spike M6.enabled), so a skip here means a
          # runner-image change has silently retired the test rather than
          # that the hazard went away -- exactly the failure mode the
          # symlink assertion above exists to prevent.
          $shortSkips = @(Select-String -Path $out -SimpleMatch 'SKIP(8dot3-capability)')
          if ($shortSkips.Count -gt 0) {
            Write-Host "::error::$($shortSkips.Count) test(s) skipped for missing 8.3 short-name capability - the F1 alias-bypass proof is no longer running on this image:"
            $shortSkips | ForEach-Object { Write-Host $_.Line }
            $failed = $true
          } else {
            Write-Host "8dot3-capability skips: 0 (as required)"
          }
          if ($failed -or ($testExit -ne 0)) { exit 1 }
      # P5.6 — retain the full -v suite output so failures on this
      # gating job stay inspectable after the run log expires.
      - name: Upload test log
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-symlink-test-log
          path: ${{ runner.temp }}/go-test-output.txt
          if-no-files-found: ignore
          retention-days: 14

  # ------------------------------------------------------------------
  # P0.3 / review F1 — Degraded-mode job: deliberately runs the suite
  # with SCRATCHPAD_TEST_SYMLINKS=0 and asserts that everything else
  # still passes, i.e. publish-only workflows survive without link
  # capability while every symlink-dependent test visibly reports
  # SKIP(symlink-capability). This is the P4.4 "watch failure does not
  # disable publish-only workflows" evidence in embryo, and it keeps the
  # =0 off-switch loud: flipping it can only ever move tests from PASS
  # to a counted, asserted SKIP in this job — never silently erase them
  # from the required job above.
  #
  # The allowance this job used to carry is GONE. P4.4 landed, and run
  # 32970247103 recorded this job green, so a red here is now a real
  # regression in the degraded (no-symlink) path and fails the workflow.
  # ------------------------------------------------------------------
  windows-degraded-test:
    name: Windows amd64 native — degraded mode, no symlinks (windows-2025)
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      CGO_ENABLED: 0
      SCRATCHPAD_TEST_SYMLINKS: "0" # deliberate: force the no-capability path for the whole suite
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: go vet
        shell: pwsh
        run: go vet ./...
      # review F2: `if: always()` so the test step executes and its output
      # is observable even while vet fails on the missing Windows backend.
      - name: go test (degraded mode, -v, symlink tests must skip)
        if: ${{ always() }}
        shell: pwsh
        run: |
          Write-Host "SCRATCHPAD_TEST_SYMLINKS=$env:SCRATCHPAD_TEST_SYMLINKS (deliberately 0 in this job)"
          $out = Join-Path $env:RUNNER_TEMP "go-test-output.txt"
          go test ./... -v 2>&1 | Tee-Object -FilePath $out
          $testExit = $LASTEXITCODE
          Write-Host "go test exit code: $testExit"
          $failed = $false
          # Non-vacuous guard, same as the symlink-capable job: "passes in
          # degraded mode" means nothing if no test actually ran.
          $results = @(Select-String -Path $out -Pattern '^--- (PASS|FAIL|SKIP): ')
          if ($results.Count -eq 0) {
            Write-Host "::error::no '--- PASS/FAIL/SKIP:' result lines in the go test output - the suite did not actually run."
            $failed = $true
          } else {
            Write-Host "test result lines: $($results.Count)"
          }
          # The symlink-dependent tests must visibly skip through the
          # RequireSymlinks guard - zero skips here would mean the =0
          # off-switch no longer routes through the guard (or the guarded
          # tests vanished), which is exactly the silent failure mode this
          # job exists to catch. (If the Phase 1 ADR replaces the probe -
          # see review F5 / P1.6 - this assertion moves with it.)
          $capSkips = @(Select-String -Path $out -SimpleMatch 'SKIP(symlink-capability)')
          if ($capSkips.Count -eq 0) {
            Write-Host "::error::no SKIP(symlink-capability) lines in degraded mode - the SCRATCHPAD_TEST_SYMLINKS=0 off-switch is no longer visibly routing through the RequireSymlinks guard."
            $failed = $true
          } else {
            Write-Host "symlink-capability skips: $($capSkips.Count) (expected in degraded mode)"
          }
          # Everything that is not symlink-gated must still pass: publish,
          # annotations on real directories, web serving, CLI behavior.
          if ($failed -or ($testExit -ne 0)) { exit 1 }
      # P5.6 — retain the full -v suite output (same rationale as the
      # symlink-capable job).
      - name: Upload test log
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-degraded-test-log
          path: ${{ runner.temp }}/go-test-output.txt
          if-no-files-found: ignore
          retention-days: 14

  # ------------------------------------------------------------------
  # P0.3 — Native Windows arm64 job (windows-11-arm runner): build-only
  # coverage for the second architecture. P2.6 made this REQUIRED: both
  # commands now compile natively on arm64 against the platform stubs.
  # ------------------------------------------------------------------
  windows-arm64-build:
    name: Windows arm64 native — build (windows-11-arm)
    runs-on: windows-11-arm
    timeout-minutes: 15
    env:
      CGO_ENABLED: 0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Build both commands natively
        shell: pwsh
        run: go build ./cmd/...

  # ------------------------------------------------------------------
  # P5.3/P5.4/P5.6 — Windows release archives, cross-built from Linux.
  # Runs on every push and PR: `make release-windows` cross-compiles both
  # architectures into dist/, zips each with installer/docs/licence
  # material, self-verifies the archive contents (scripts/mkrelease.go
  # re-opens each zip and checks the exact name set plus PE magic), and
  # writes SHA256SUMS.txt, which the job then independently re-verifies
  # with sha256sum -c. The archives are retained as workflow artifacts
  # for review; they are NOT release assets — that is the tag-gated
  # release job below.
  #
  # scripts/install.ps1 (P5.1, in progress) is included when present;
  # until it lands, mkrelease warns and builds the archive without it.
  # Only the tagged-release path makes its absence fatal.
  # ------------------------------------------------------------------
  # ------------------------------------------------------------------
  # P6.1 / P6.6 — stress and race campaigns. The plan's "Verification
  # Commands" list these explicitly; P0.5 finding F7 deferred them here
  # rather than to the Phase 0 gate.
  #
  # Repetition and -race catch a different class of defect than a single
  # pass: the store and watcher both hold handles across concurrent
  # mutation, and several bugs found during this port (a dup'd fd sharing
  # its read offset, reconcile identity churn) only surface on repeat.
  #
  # Deliberately NOT continue-on-error: if this goes red it is either a
  # real race or a flaky test, and the plan says to investigate flakes
  # rather than paper over them with broad retries.
  # ------------------------------------------------------------------
  stress-linux:
    name: Linux — race and repetition (P6.1)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: go test -race
        run: go test -race ./internal/store ./internal/watch ./internal/web
      - name: store, 20 runs
        run: go test ./internal/store -count=20
      - name: watch, 20 runs
        run: go test ./internal/watch -count=20

  stress-windows:
    name: Windows amd64 — race and repetition (P6.1)
    runs-on: windows-2025
    timeout-minutes: 45
    # Windows repetition is slower and newer than the Linux equivalent;
    # it stays advisory until P6.1 has run it enough times to establish a
    # flake baseline. Removing this allowance is a P6.1 deliverable.
    continue-on-error: true
    env:
      CGO_ENABLED: 0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      # -race needs cgo and a C toolchain, so this ONE step overrides the
      # job's CGO_ENABLED=0. The runner image ships mingw-w64 gcc; the step
      # prints the compiler it found so a missing toolchain is legible in
      # the log rather than surfacing as an opaque link error.
      - name: go test -race (cgo required)
        shell: pwsh
        env:
          CGO_ENABLED: 1
        run: |
          gcc --version
          go test -race ./internal/store ./internal/watch ./internal/web
      - name: store, 20 runs
        shell: pwsh
        run: go test ./internal/store -count=20
      - name: watch, 20 runs
        shell: pwsh
        run: go test ./internal/watch -count=20

  # ------------------------------------------------------------------
  # P5.1/P5.2/P5.5 — installer verification on a real Windows runner.
  # scripts/verify-install.ps1 exercises every install.ps1 operation
  # (cli, skill, all, drop-mcp, install, startup, start, status, stop,
  # remove-startup, uninstall, unknown-verb exit 2), runs each twice to
  # prove idempotence, pre-creates %USERPROFILE%\.scratchpad with a
  # marker and asserts it survives a full install + uninstall (the
  # review-checklist rule), drives the Scheduled Task through
  # register/start/status/stop/unregister with live HTTP probes of
  # 127.0.0.1:8737, and covers the P5.5 edge cases: an install path
  # with a space and a non-ASCII character, a non-administrator local
  # user, and an overridden SCRATCHPAD_ROOT (shell-only vs persisted).
  #
  # The matrix runs the same assertions against both engines: pwsh
  # (PowerShell 7) and powershell (Windows PowerShell 5.1). The harness
  # itself always runs under pwsh; -Engine selects what executes
  # install.ps1. Matrix legs mutate per-user state (HKCU PATH, the
  # scheduled task, %LOCALAPPDATA%), which is safe only because each
  # leg gets its own ephemeral VM.
  # ------------------------------------------------------------------
  windows-installer:
    name: Windows installer verification — ${{ matrix.engine }} (P5.1/P5.2/P5.5)
    runs-on: windows-2025
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        engine: [pwsh, powershell]
    env:
      CGO_ENABLED: 0
      # env indirection, not run-block ${{ }} interpolation (house style;
      # the values are workflow literals, but the discipline is uniform).
      INSTALL_ENGINE: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Build both commands natively
        shell: pwsh
        run: go build -o bin/ ./cmd/...
      - name: Verify install.ps1 end to end
        shell: pwsh
        run: pwsh -NoProfile -File scripts/verify-install.ps1 -Engine $env:INSTALL_ENGINE

  # ------------------------------------------------------------------
  # P5.7 - install from the RELEASE ARCHIVE, not from a checkout.
  #
  # windows-installer above runs install.ps1 out of the git working tree,
  # where binaries sit in bin\ and the skill in skill\. That is not the
  # layout users get. It passed 94/94 on both engines while the shipped
  # archive could not install itself at all: install.ps1 resolved payloads
  # only against $RepoDir (= the parent of the script's directory), which
  # for an extracted archive is the parent of the extracted folder, and
  # SKILL.md was not in the archive at all - so `cli` failed outright and
  # `skill`/`all`/`install` had no source to copy. A control that is owned,
  # green, and pointed at the wrong artefact is worth less than no control,
  # because it is believed.
  #
  # So this job exercises the thing a user downloads: package the archives,
  # extract one into a scratch directory, and drive install/upgrade/
  # uninstall/reinstall through it. Three properties make it non-vacuous:
  #
  #   1. The extraction parent is asserted to contain no bin\ and no skill\,
  #      so a pass cannot come from the checkout-layout fallback firing.
  #   2. The checksum block re-derives every hash with Get-FileHash - the
  #      exact command docs/windows.md tells users to run - and compares it
  #      to SHA256SUMS.txt, so the published verification instruction is
  #      executed rather than asserted.
  #   3. A minimum assertion count fails the job if the block stops running
  #      its checks, so "0 failures" can never mean "0 checks".
  #
  # Cost: two windows-2025 legs, ~5 minutes each, sharing the runner class
  # the installer job already uses. Both engines are kept because engine
  # parity is exactly the claim docs/windows.md makes.
  # ------------------------------------------------------------------
  windows-archive-install:
    name: Windows install from the release ARCHIVE - ${{ matrix.engine }} (P5.7)
    runs-on: windows-2025
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        engine: [pwsh, powershell]
    env:
      CGO_ENABLED: 0
      # env indirection, not run-block ${{ }} interpolation (house style).
      INSTALL_ENGINE: ${{ matrix.engine }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Build both architectures into dist/
        shell: pwsh
        run: |
          go build -o dist/windows-amd64/ ./cmd/...
          $env:GOARCH = 'arm64'
          go build -o dist/windows-arm64/ ./cmd/...
      - name: Package the release archives (installer required)
        shell: pwsh
        run: go run scripts/mkrelease.go -dist dist -version citest -require-installer
      - name: Verify SHA256SUMS.txt the way the docs tell users to
        shell: pwsh
        run: |
          $fail = 0; $passed = 0
          function Assert([bool]$Cond, [string]$What) {
            if ($Cond) { $script:passed++; Write-Host "  ok    $What" }
            else { $script:fail++; Write-Host "::error::FAIL  $What" }
          }
          $zips = @(Get-ChildItem -Path dist -Filter *.zip | Sort-Object Name)
          $lines = @(Get-Content -LiteralPath dist\SHA256SUMS.txt | Where-Object { $_.Trim() -ne '' })
          Assert ($zips.Count -eq 2) "packaging produced 2 archives (found $($zips.Count))"
          Assert ($lines.Count -eq $zips.Count) "SHA256SUMS.txt covers every archive ($($lines.Count) lines vs $($zips.Count) archives)"
          $covered = @()
          foreach ($line in $lines) {
            $parts = $line -split '\s+', 2
            $want = $parts[0].ToLowerInvariant()
            $name = $parts[1].Trim()
            $path = Join-Path 'dist' $name
            Assert (Test-Path -LiteralPath $path) "SHA256SUMS.txt names an archive that exists: $name"
            if (Test-Path -LiteralPath $path) {
              # Get-FileHash is verbatim what docs/windows.md instructs.
              $got = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
              Assert ($got -eq $want) "Get-FileHash matches SHA256SUMS.txt for $name"
              $covered += $name
            }
          }
          foreach ($z in $zips) {
            Assert ($covered -contains $z.Name) "archive $($z.Name) has a checksum line"
          }
          Write-Host "assertions: $passed passed, $fail failed"
          if ($passed -lt 8) { Write-Host "::error::only $passed assertions ran - the checksum block did not execute its checks"; exit 1 }
          if ($fail -gt 0) { exit 1 }
      - name: Install, upgrade, uninstall and reinstall from an extracted archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $fail = 0; $passed = 0
          function Assert([bool]$Cond, [string]$What) {
            if ($Cond) { $script:passed++; Write-Host "  ok    $What" }
            else { $script:fail++; Write-Host "::error::FAIL  $What" }
          }

          $engine = $env:INSTALL_ENGINE
          Write-Host "engine under test: $engine"

          # A scratch tree well away from the checkout. $sandbox is what
          # install.ps1 computes as $RepoDir when the script runs from
          # $sandbox\pkg, so it must not look like a checkout.
          $sandbox = Join-Path $env:RUNNER_TEMP ("archive-" + [Guid]::NewGuid().ToString('N'))
          $pkg = Join-Path $sandbox 'pkg'
          New-Item -ItemType Directory -Path $pkg -Force | Out-Null
          Expand-Archive -LiteralPath (Join-Path 'dist' 'scratchpad_citest_windows_amd64.zip') -DestinationPath $pkg -Force

          Assert (-not (Test-Path -LiteralPath (Join-Path $sandbox 'bin')))   "no bin\ beside the extracted folder - the checkout-layout fallback cannot fire"
          Assert (-not (Test-Path -LiteralPath (Join-Path $sandbox 'skill'))) "no skill\ beside the extracted folder"
          Assert (-not (Test-Path -LiteralPath (Join-Path $pkg 'scripts')))   "the archive has no scripts\ subdirectory (what docs/windows.md now says)"
          Assert (Test-Path -LiteralPath (Join-Path $pkg 'install.ps1'))      "install.ps1 is at the archive root"
          Assert (Test-Path -LiteralPath (Join-Path $pkg 'skill\SKILL.md'))   "skill\SKILL.md ships in the archive"
          Assert (Test-Path -LiteralPath (Join-Path $pkg 'scratchpad.exe'))   "scratchpad.exe ships in the archive"

          # An overridden data root, with a space and a non-ASCII character,
          # pre-seeded with a marker: uninstall must never touch it.
          $root = Join-Path $sandbox 'data root e'
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          $marker = Join-Path $root 'marker.txt'
          Set-Content -LiteralPath $marker -Value 'do not touch' -NoNewline
          $before = (Get-FileHash -LiteralPath $marker -Algorithm SHA256).Hash
          $env:SCRATCHPAD_ROOT = $root
          $bin = Join-Path $sandbox 'bin target'
          $ps1 = Join-Path $pkg 'install.ps1'

          # NOTE: the parameter must not be named $Args. That is a PowerShell
          # automatic variable, and binding it silently yields an empty array,
          # which ran every verb below as a bare `install.ps1` (default verb,
          # default BinDir) while still reporting exit 0. The sentinel below
          # is the same discipline: if the child never launches, $LASTEXITCODE
          # keeps whatever the previous native call left there, so an
          # unlaunched command would otherwise read as success.
          function Invoke-Installer([string[]]$InstallerArgs) {
            Write-Host "--> $engine install.ps1 $($InstallerArgs -join ' ')"
            $global:LASTEXITCODE = 97
            if ($engine -eq 'powershell') {
              & powershell -NoProfile -ExecutionPolicy Bypass -File $ps1 @InstallerArgs 2>&1 | ForEach-Object { Write-Host "      $_" }
            } else {
              & pwsh -NoProfile -ExecutionPolicy Bypass -File $ps1 @InstallerArgs 2>&1 | ForEach-Object { Write-Host "      $_" }
            }
            return $LASTEXITCODE
          }

          Assert ((Invoke-Installer @('cli', '-BinDir', $bin)) -eq 0) "cli from the archive exits 0"
          Assert (Test-Path -LiteralPath (Join-Path $bin 'scratchpad.exe')) "cli installed scratchpad.exe into -BinDir"

          # The shipped binary must actually run, not merely copy. Same
          # sentinel: "file not found" is a PowerShell error, not a native
          # exit code, and would leave $LASTEXITCODE at its previous value.
          $exe = Join-Path $bin 'scratchpad.exe'
          $global:LASTEXITCODE = 98
          if (Test-Path -LiteralPath $exe) {
            & $exe list 2>&1 | ForEach-Object { Write-Host "      $_" }
          }
          Assert ($LASTEXITCODE -eq 0) "the installed scratchpad.exe runs (list exits 0)"

          Assert ((Invoke-Installer @('skill')) -eq 0) "skill from the archive exits 0"
          Assert (Test-Path -LiteralPath (Join-Path $env:USERPROFILE '.claude\skills\scratchpad\SKILL.md')) "SKILL.md installed under ~\.claude"
          Assert (Test-Path -LiteralPath (Join-Path $env:USERPROFILE '.pi\agent\skills\scratchpad\SKILL.md')) "SKILL.md installed under ~\.pi"

          # Upgrade over an existing install using the DEFAULT verb.
          Assert ((Invoke-Installer @('all', '-BinDir', $bin)) -eq 0) "all (the default verb) over an existing install exits 0"
          Assert (Test-Path -LiteralPath (Join-Path $bin 'scratchpad.exe')) "binary still present after the upgrade run"

          Assert ((Invoke-Installer @('uninstall', '-BinDir', $bin)) -eq 0) "uninstall exits 0"
          Assert (-not (Test-Path -LiteralPath (Join-Path $bin 'scratchpad.exe'))) "uninstall removed the binary"
          Assert (-not (Test-Path -LiteralPath (Join-Path $env:USERPROFILE '.claude\skills\scratchpad'))) "uninstall removed the ~\.claude skill copy"
          Assert (-not (Test-Path -LiteralPath (Join-Path $env:USERPROFILE '.pi\agent\skills\scratchpad'))) "uninstall removed the ~\.pi skill copy"
          Assert ((Invoke-Installer @('uninstall', '-BinDir', $bin)) -eq 0) "second uninstall exits 0 (idempotent)"

          Assert (Test-Path -LiteralPath $root) "the overridden SCRATCHPAD_ROOT still exists"
          Assert (Test-Path -LiteralPath $marker) "the data-root marker still exists"
          if (Test-Path -LiteralPath $marker) {
            Assert ((Get-FileHash -LiteralPath $marker -Algorithm SHA256).Hash -eq $before) "the data-root marker is byte-identical"
          }

          # Nothing uninstall leaves behind may trip a reinstall.
          Assert ((Invoke-Installer @('cli', '-BinDir', $bin)) -eq 0) "reinstall after uninstall exits 0"
          Assert (Test-Path -LiteralPath (Join-Path $bin 'scratchpad.exe')) "reinstall restored the binary"

          Write-Host "assertions: $passed passed, $fail failed"
          if ($passed -lt 20) { Write-Host "::error::only $passed assertions ran - the block did not execute its checks"; exit 1 }
          if ($fail -gt 0) { exit 1 }

  windows-artifacts:
    name: Windows release archives (cross-built from Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # full history so `git describe` can version the archives from tags
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      # P5.7 - the Makefile's default VERSION is `git describe --tags`, and its
      # recipe expands $(VERSION) UNQUOTED into /bin/sh. Git permits ; $ ` | &
      # in a tag name, so a tag reachable from the pushed commit could inject
      # shell here. Resolve it once, validate it, and pass it explicitly.
      - name: Resolve and validate the archive version
        run: |
          v="$(git describe --tags --always --dirty 2>/dev/null || echo dev)"
          if [[ ! "$v" =~ ^[0-9A-Za-z][0-9A-Za-z._+-]*$ ]]; then
            echo "::error::refusing to package with version string '$v': only [0-9A-Za-z._+-] are allowed. A tag name with shell metacharacters is the likely cause."
            exit 1
          fi
          echo "ARCHIVE_VERSION=$v" >> "$GITHUB_ENV"
          echo "archive version: $v"
      - name: Build, package, and self-verify archives
        run: make release-windows VERSION="$ARCHIVE_VERSION"
      # P5.7 - `sha256sum -c` only checks the files SHA256SUMS.txt names; it
      # says nothing about a .zip in dist/ that no line covers. Since the
      # upload/publish steps below use a dist/*.zip glob, assert the reverse
      # direction too, so nothing can ship uncovered by the checksum file.
      - name: Verify checksums independently, both directions
        run: |
          cd dist
          sha256sum -c SHA256SUMS.txt
          for z in *.zip; do
            grep -qF "  $z" SHA256SUMS.txt || {
              echo "::error::$z is present in dist/ but has no line in SHA256SUMS.txt"
              exit 1
            }
          done
          echo "every archive in dist/ is covered by SHA256SUMS.txt"
      - name: Upload archives
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-release-archives
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  # ------------------------------------------------------------------
  # P5.6 — Release assets, TAGS ONLY. The workflow triggers on every
  # push (branches and tags alike), so the gate lives on the job: it
  # runs only for push events whose ref is a v* tag — a branch push can
  # never satisfy `startsWith(github.ref, 'refs/tags/v')` because branch
  # refs are refs/heads/*, and pull_request refs are refs/pull/*.
  #
  # The job rebuilds the archives from the tagged commit (rather than
  # trusting a cross-job artifact) with VERSION set to the tag name and
  # -require-installer, so a tagged release can never ship without
  # scripts/install.ps1. It then creates a DRAFT GitHub release carrying
  # the zips and SHA256SUMS.txt — a human publishes it after review; no
  # code signing (explicitly out of scope for the first release).
  # `contents: write` is scoped to this job only; the workflow default
  # stays read-only.
  # ------------------------------------------------------------------
  release:
    name: Draft release assets (v* tags only)
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    needs: [linux-test, cross-build-windows, windows-arm64-build, windows-artifacts, windows-archive-install]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      # env indirection, not run-block ${{ }} interpolation, to keep ref
      # names out of the shell-injection surface (same discipline as the
      # concurrency comment above).
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      # P5.7 - reject a tag name that is not a plain version BEFORE it reaches
      # a shell. `git check-ref-format` accepts ; $ ` | & in a tag name, and
      # RELEASE_TAG flows into `make ... VERSION="$RELEASE_TAG"`, whose recipe
      # expands $(VERSION) unquoted into /bin/sh. Reproduced locally: a tag
      # named `v1.0;<command>;` runs <command> in this job - the only job in
      # the workflow holding `contents: write` and a GH_TOKEN, so it converts
      # tag-push rights into arbitrary code with a write token. The accepted
      # set here is strictly narrower than git's, which makes the injection
      # unreachable no matter what the Makefile quotes.
      - name: Validate the release tag name
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9][0-9A-Za-z.+-]*$ ]]; then
            echo "::error::refusing to release from tag '$RELEASE_TAG': a release tag must match ^v[0-9][0-9A-Za-z.+-]*$"
            exit 1
          fi
          echo "release tag: $RELEASE_TAG"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Build release archives (installer required)
        run: make release-windows VERSION="$RELEASE_TAG" RELEASE_FLAGS=-require-installer
      # P5.7 - `sha256sum -c` only checks the files SHA256SUMS.txt names; it
      # says nothing about a .zip in dist/ that no line covers. Since the
      # upload/publish steps below use a dist/*.zip glob, assert the reverse
      # direction too, so nothing can ship uncovered by the checksum file.
      - name: Verify checksums independently, both directions
        run: |
          cd dist
          sha256sum -c SHA256SUMS.txt
          for z in *.zip; do
            grep -qF "  $z" SHA256SUMS.txt || {
              echo "::error::$z is present in dist/ but has no line in SHA256SUMS.txt"
              exit 1
            }
          done
          echo "every archive in dist/ is covered by SHA256SUMS.txt"
      - name: Create draft release with assets
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            # P5.7 - re-running this job against an already PUBLISHED release
            # would swap the assets under it without any human seeing the new
            # build. Draft releases are re-buildable; published ones are not.
            if [ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" != "true" ]; then
              echo "::error::release $RELEASE_TAG is already published; refusing to replace its assets from CI. Cut a new tag instead."
              exit 1
            fi
            echo "draft release $RELEASE_TAG exists — replacing assets"
            gh release upload "$RELEASE_TAG" dist/*.zip dist/SHA256SUMS.txt --clobber
          else
            gh release create "$RELEASE_TAG" --draft --verify-tag \
              --title "$RELEASE_TAG" \
              --notes "Draft release for $RELEASE_TAG. Verify archives against SHA256SUMS.txt before publishing. Binaries are unsigned (signing is out of scope for the first release)." \
              dist/*.zip dist/SHA256SUMS.txt
          fi
