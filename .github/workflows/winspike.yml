# =====================================================================
# TEMPORARY PHASE 1 INSTRUMENT — DELETE AT THE END OF PHASE 1.
#
# This workflow exists for one reason: there is no local Windows machine,
# so a GitHub `windows-2025` runner is the measurement instrument for the
# P1.2 rooted-traversal prototype and the P1.4 link probes. It runs
# internal/winspike in ISOLATION (`go test ./internal/winspike/...`),
# because the rest of the tree does not have a Windows store backend yet.
#
# It is deliberately NOT part of ci.yml:
#   * ci.yml is the release gate; this is a research probe whose job is to
#     print facts, and a probe must never become a gate by accident.
#   * internal/winspike is deleted when the P1.6 ADR is accepted, and this
#     file goes with it. Owner: the Phase 1 spike (P1.2 / P1.4).
#
# Reading the results: every measurement prints one line of the form
#   WINSPIKE|<id>|<verdict>|<detail>
# The "Findings" step lifts them out of the log into the job summary, and
# the full -v log is uploaded as an artifact on every run, pass or fail.
#
# The job is allowed to FAIL. Measurements report rather than assert, with
# one exception: RequireProperty fails loudly when the runner contradicts a
# property the Windows backend is REQUIRED to have (verdict SECURITY-FAIL).
# A red run here means "a required containment property does not hold on
# real Windows", which is precisely the answer Phase 1 exists to get.
# =====================================================================
name: Winspike (Phase 1 temporary)

on:
  push:
    branches: [feat/native-windows-support]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: winspike-${{ github.ref }}
  cancel-in-progress: true

jobs:
  winspike:
    name: Win32 spike measurements (windows-2025)
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      CGO_ENABLED: 0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Runner facts
        shell: pwsh
        run: |
          Get-CimInstance Win32_OperatingSystem |
            Select-Object Caption, Version, BuildNumber, OSArchitecture | Format-List
          Write-Host "Developer Mode (AllowDevelopmentWithoutDevLicense):"
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock'
          if (Test-Path $key) {
            Get-ItemProperty $key | Format-List
          } else {
            Write-Host "  (registry key absent)"
          }
          Write-Host "Elevated: $(([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator))"
          Write-Host "Volumes:"
          Get-Volume | Select-Object DriveLetter, FileSystem, FileSystemType, SizeRemaining | Format-Table
          Write-Host "8dot3 name creation state:"
          fsutil 8dot3name query C: 2>&1 | Write-Host

      # The spike package is the only thing that compiles on Windows today,
      # so it is vetted and tested on its own. `./...` would fail on the
      # store backend and hide these results.
      - name: go vet (spike package only)
        shell: pwsh
        run: go vet ./internal/winspike/...

      - name: go test (spike package only, -v)
        id: spike
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "winspike.txt"
          go test ./internal/winspike/... -v -count=1 -timeout 20m 2>&1 | Tee-Object -FilePath $out
          $code = $LASTEXITCODE
          Write-Host "go test exit code: $code"
          Add-Content -Path $env:GITHUB_ENV -Value "WINSPIKE_LOG=$out"
          # Never swallow the result, but let the Findings step run first.
          Add-Content -Path $env:GITHUB_ENV -Value "WINSPIKE_EXIT=$code"

      - name: Findings
        if: always()
        shell: pwsh
        run: |
          $out = $env:WINSPIKE_LOG
          if (-not $out -or -not (Test-Path $out)) {
            Write-Host "::error::no spike log was produced"
            exit 1
          }
          $lines = @(Select-String -Path $out -SimpleMatch 'WINSPIKE|' |
                     ForEach-Object { ($_.Line -split 'WINSPIKE\|',2)[1] })
          if ($lines.Count -eq 0) {
            Write-Host "::error::the spike produced no WINSPIKE| measurement lines - the harness did not run"
            exit 1
          }
          Write-Host "==================== MEASUREMENTS ($($lines.Count)) ===================="
          $lines | ForEach-Object { Write-Host $_ }
          "## Winspike measurements ($($lines.Count))" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          '| id | verdict | detail |' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          '|---|---|---|' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          foreach ($l in $lines) {
            $p = $l -split '\|', 3
            if ($p.Count -eq 3) {
              $detail = $p[2] -replace '\|', '\|'
              "| ``$($p[0])`` | $($p[1]) | $detail |" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            }
          }
          $violations = @($lines | Where-Object { $_ -match '^\S+\|SECURITY-FAIL\|' })
          if ($violations.Count -gt 0) {
            Write-Host "::error::$($violations.Count) REQUIRED security propert(ies) contradicted by the runner:"
            $violations | ForEach-Object { Write-Host "::error::$_" }
          }

      - name: Upload full log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: winspike-log-windows-2025
          path: ${{ env.WINSPIKE_LOG }}
          if-no-files-found: warn
          retention-days: 14

      - name: Propagate the test result
        if: always()
        shell: pwsh
        run: |
          if ($env:WINSPIKE_EXIT -ne "0") {
            Write-Host "::error::go test exited $($env:WINSPIKE_EXIT) - see the measurements above"
            exit 1
          }

  # Secondary data point: the same harness on arm64, so architecture-dependent
  # answers (structure layouts, $UpCase, OS build) are not read from one image.
  # Allowed to fail; it is evidence, not a gate.
  winspike-arm64:
    name: Win32 spike measurements (windows-11-arm) [secondary]
    runs-on: windows-11-arm
    timeout-minutes: 25
    continue-on-error: true
    env:
      CGO_ENABLED: 0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: go test (spike package only, -v)
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "winspike-arm64.txt"
          go test ./internal/winspike/... -v -count=1 -timeout 20m 2>&1 | Tee-Object -FilePath $out
          $code = $LASTEXITCODE
          Add-Content -Path $env:GITHUB_ENV -Value "WINSPIKE_LOG=$out"
          Write-Host "==================== MEASUREMENTS ===================="
          Select-String -Path $out -SimpleMatch 'WINSPIKE|' |
            ForEach-Object { Write-Host (($_.Line -split 'WINSPIKE\|',2)[1]) }
          if ($code -ne 0) { exit 1 }
      - name: Upload full log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: winspike-log-windows-11-arm
          path: ${{ env.WINSPIKE_LOG }}
          if-no-files-found: warn
          retention-days: 14
